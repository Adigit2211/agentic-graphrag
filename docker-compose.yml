# v0.1: ollama + api only (graph and vector stores are in-process).
# NOTE: this file has not been verified in CI; see README "Verification status".
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    # For NVIDIA GPUs, uncomment (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-llama3.1:8b}"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      EMBEDDER: ${EMBEDDER:-sentence-transformers}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  ollama_data:
