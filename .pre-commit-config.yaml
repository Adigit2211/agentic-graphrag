# Uses the tools installed by `make install` so versions always match pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy app ingestion graph retrieval agent llm scripts tests
        language: system
        pass_filenames: false
        types: [python]
